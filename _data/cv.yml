    Experience:
      - company: Structure-Aware Learning for Policy, Reasoning, and Decision
        position: Doctoral Researcher, University of Glasgow
        location: Glasgow, UK
        start_date: 2025-07
        highlights:
          - Developed advantage-guided and preference-based methods for adaptive exploration in RL.
          - Designed stability-aware objectives and proxy supervision signals to improve structural generalization.
          - Formulated geometry-aligned policy learning principles beyond Gaussian action distributions.
          - Built unified perspectives linking action manifolds, Bellman stability, and structural RL supervision.

      - company: Multi-Agent Safety Planning in Dynamic Scenarios
        position: Doctoral Researcher, UofG & LAMIH
        location: Glasgow, UK & France
        start_date: 2024-08
        end_date: 2025-07
        summary: "Supervisors: Dr. J. Lan, Prof. D. Flynn, Dr. Christos Anagnostopoulos, Dr. A. Nguyen"
        highlights:
          - Developed MCTS-based coordination algorithms for interactive driving at unsignalized intersections.
          - Proposed a scalable framework for mixed traffic with centralized and decentralized policies.
          - Developed safety-critical pruning and interaction-graph filtering to reduce planning complexity.
          - Designed contingency-aware trajectory optimization for safe planning under uncertainty.

      - company: Interactive Decision Making for Autonomy
        position: Doctoral Researcher, University of Glasgow
        location: Glasgow, UK
        start_date: 2023-11
        end_date: 2024-08
        summary: "Supervisors: Dr. Jianglin Lan and Prof. Dezong Zhao"
        highlights:
          - Developed KAN-based RL systems for driving tasks like roundabouts and ramp merging.
          - Proposed multi-agent actor-critic models with LSTM intention modeling for road interactions.
          - Designed reward shaping and exploration for efficient policy learning in racing scenarios.
          - Integrated uncertainty-aware game-theoretic planning modules for safe interactive autonomy.

      - company: Robust and Dynamic-Aware SLAM for Autonomy
        position: Doctoral Researcher, UofG & SJTU
        location: Glasgow, UK
        start_date: 2023-02
        end_date: 2023-11
        summary: "Supervisors: Dr. Jianglin Lan and Dr. Hanyang Zhuang"
        highlights:
          - Developed visual SLAM for dynamic environments using point-line features and semantic cues.
          - Built a multi-modal mapping pipeline that filters dynamic objects via detection and epipolar constraints.
          - Integrated SLAM with CLF-CBF and TEB planning for safe navigation in unstructured scenes.
          - Optimized trajectories with stability and dynamic-awareness for long-term autonomous deployment.

